---
- hosts: all
  remote_user: root
  tasks:
    - name: install neovim
      package:
        name: neovim
        state: present
    - name: install git
      package:
        name: git
        state: present
    - name: Update or clone nvim config
      git:
        repo: 'https://github.com/nemanjan00/vim.git'
        dest: ~/.config/nvim
    - name: Install vim-plug
      get_url:
        url: 'https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim'
        dest: ~/.config/nvim/autoload/plug.vim
    - name: Symlink ~/.vim to nvim config (plugins and undo history)
      file:
        src: ~/.config/nvim
        dest: ~/.vim
        state: link
    #- name: Install or update plugins
      #shell: nvim --headless +PlugInstall +qall
